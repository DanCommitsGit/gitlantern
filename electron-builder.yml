appId: io.github.dancommitsgit.gitlantern
productName: GitLantern
directories:
  buildResources: build
files:
  - out/**
  - resources/**
asarUnpack:
  - resources/**
win:
  executableName: gitlantern
  target:
    - nsis
    - portable
portable:
  artifactName: ${name}-${version}-portable.${ext}
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSDocumentsFolderUsageDescription: GitLantern needs access to open git repositories in your Documents folder.
    NSDownloadsFolderUsageDescription: GitLantern needs access to open git repositories in your Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
    - rpm
  maintainer: DanCommitsGit <61391827+DanCommitsGit@users.noreply.github.com>
  category: Development
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  resetAdHocDarwinSignature: true
publish:
  provider: github
  owner: DanCommitsGit
  repo: gitlantern
  releaseType: draft
